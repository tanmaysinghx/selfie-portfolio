<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">The life of one seat</title><desc id="d">A seat moves from available to held with a timer, then to booked when payment is confirmed. If the timer expires or payment fails, the hold is released and the seat becomes available again. Reference design.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fa8ff"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffb283"/></marker></defs>
<rect width="1200" height="560" rx="20" fill="#0e1830"/><g font-family="Segoe UI,Arial,sans-serif"><text x="54" y="62" font-size="16" letter-spacing="3" fill="#71e0cd">THE LIFE OF ONE SEAT</text><text x="54" y="108" font-size="34" font-weight="700" fill="#f0f5ff">A hold is a lease, not a sale.</text>
<rect x="60" y="210" width="240" height="120" rx="18" fill="#192c49" stroke="#6ce5c6" stroke-width="3"/><text x="180" y="258" text-anchor="middle" fill="#6ce5c6" font-size="15" letter-spacing="3">STATE 1</text><text x="180" y="294" text-anchor="middle" fill="#edf3ff" font-size="28" font-weight="700">AVAILABLE</text>
<rect x="480" y="210" width="240" height="120" rx="18" fill="#192c49" stroke="#ffb283" stroke-width="3"/><text x="600" y="258" text-anchor="middle" fill="#ffb283" font-size="15" letter-spacing="3">STATE 2</text><text x="600" y="294" text-anchor="middle" fill="#edf3ff" font-size="28" font-weight="700">HELD</text>
<g fill="none" stroke="#ffb283" stroke-width="3"><circle cx="600" cy="176" r="22"/><path d="M600 162V176L610 184"/></g><text x="640" y="182" fill="#ffbf97" font-size="16">expires in minutes</text>
<rect x="900" y="210" width="240" height="120" rx="18" fill="#192c49" stroke="#a6b4ff" stroke-width="3"/><text x="1020" y="258" text-anchor="middle" fill="#a6b4ff" font-size="15" letter-spacing="3">STATE 3</text><text x="1020" y="294" text-anchor="middle" fill="#edf3ff" font-size="28" font-weight="700">BOOKED</text>
<g fill="none" stroke-width="3"><path d="M300 250H472" stroke="#8fa8ff" marker-end="url(#a)"/><path d="M720 250H892" stroke="#8fa8ff" marker-end="url(#a)"/><path d="M600 330V400H180V338" stroke="#ffb283" stroke-dasharray="9 6" marker-end="url(#r)"/></g>
<text x="390" y="236" text-anchor="middle" fill="#c8d4e9" font-size="16">atomic hold</text><text x="390" y="282" text-anchor="middle" fill="#92a8c9" font-size="14">one winner per seat</text><text x="810" y="236" text-anchor="middle" fill="#c8d4e9" font-size="16">payment confirmed</text><text x="810" y="282" text-anchor="middle" fill="#92a8c9" font-size="14">same hold id</text>
<text x="390" y="432" text-anchor="middle" fill="#ffbf97" font-size="16">timer expires · buyer cancels · payment fails → release</text>
<path d="M54 470H1144" stroke="#2a3d5c"/><text x="54" y="512" fill="#92a8c9" font-size="16">REFERENCE DESIGN · Every transition is conditional on the current state, so two buyers can never both win the same seat.</text></g></svg>
