<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">Prepare capacity before demand arrives</title><desc id="d">Conceptual graph: demand rises suddenly at match start, reactive capacity catches up later, while pre-scaled capacity is ready before the spike. No measured data.</desc>
<rect width="1200" height="600" rx="20" fill="#0e1830"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="62" fill="#75e4cf" font-size="16" letter-spacing="3">THE TIMING PROBLEM</text><text x="60" y="108" fill="#f2f5ff" font-size="34" font-weight="700">Servers need a head start.</text>
<path d="M115 175V452H1110" fill="none" stroke="#516484" stroke-width="2"/><path d="M115 250H1110M115 350H1110" stroke="#253852" stroke-dasharray="5 7"/><path d="M530 170V452" stroke="#647897" stroke-dasharray="5 7"/>
<path d="M490 385L550 270L620 248L690 228L720 290L650 352L580 390Z" fill="#ffaf7e" fill-opacity=".16"/>
<path d="M120 396L300 393L420 390L490 385L550 270L620 248L690 228L800 220L950 223L1100 233" fill="none" stroke="#a6b4ff" stroke-width="5"/>
<path d="M120 363H580L650 352L720 290L800 245L860 200H1100" fill="none" stroke="#ffb283" stroke-width="4" stroke-dasharray="11 7"/>
<path d="M120 355H300V195H1100" fill="none" stroke="#6ce5c6" stroke-width="5"/>
<text x="550" y="168" fill="#d2dcee" font-size="18">Match starts</text><text x="326" y="228" fill="#6ce5c6" font-size="17">Ready beforehand</text><text x="654" y="394" fill="#ffbf97" font-size="18">Reactive capacity arrives late</text><text x="115" y="480" fill="#9ab0cd" font-size="16">Before the event</text><text x="995" y="480" fill="#9ab0cd" font-size="16">Time →</text>
<g font-size="17"><path d="M115 529H155" stroke="#a6b4ff" stroke-width="4"/><text x="166" y="535" fill="#c8d4e9">Demand</text><path d="M345 529H385" stroke="#6ce5c6" stroke-width="4"/><text x="396" y="535" fill="#c8d4e9">Pre-scaled capacity</text><path d="M680 529H720" stroke="#ffb283" stroke-width="4" stroke-dasharray="8 5"/><text x="731" y="535" fill="#c8d4e9">Reactive capacity</text></g><text x="115" y="575" fill="#8097b8" font-size="14">Conceptual illustration only. Vertical axis represents relative demand / serving capacity.</text></g></svg>
