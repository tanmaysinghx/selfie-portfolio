# Render Blueprint for the Rust API (https://render.com/docs/blueprint-spec).
# Render → New → Blueprint → pick this repo. Secrets marked sync:false are asked for once.
services:
  - type: web
    name: selfie-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health/live
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SERVICE_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: VISITOR_HASH_SALT
        sync: false
      - key: COMMENT_MODERATION
        value: links
      - key: LOG_FORMAT
        value: json
