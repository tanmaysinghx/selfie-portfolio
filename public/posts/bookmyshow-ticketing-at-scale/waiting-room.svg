<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">A waiting room turns a crowd into a steady stream</title><desc id="d">Millions of buyers arrive at the edge, receive signed queue tokens in a waiting room, and are admitted through a valve at the rate the booking core can complete checkouts. Reference design.</desc>
<rect width="1200" height="600" rx="20" fill="#0e1830"/><g font-family="Segoe UI,Arial,sans-serif"><text x="54" y="62" font-size="16" letter-spacing="3" fill="#71e0cd">THE FRONT DOOR</text><text x="54" y="108" font-size="34" font-weight="700" fill="#f0f5ff">Millions arrive at once. Only a few thousand can check out.</text>
<g fill="#a6b4ff"><circle cx="80" cy="200" r="6"/><circle cx="104" cy="186" r="6"/><circle cx="128" cy="204" r="6"/><circle cx="92" cy="226" r="6"/><circle cx="118" cy="232" r="6"/><circle cx="146" cy="222" r="6"/><circle cx="70" cy="252" r="6"/><circle cx="98" cy="262" r="6"/><circle cx="126" cy="258" r="6"/><circle cx="154" cy="250" r="6"/><circle cx="82" cy="288" r="6"/><circle cx="110" cy="294" r="6"/><circle cx="140" cy="284" r="6"/><circle cx="166" cy="276" r="6"/><circle cx="74" cy="320" r="6"/><circle cx="102" cy="326" r="6"/><circle cx="132" cy="316" r="6"/><circle cx="160" cy="308" r="6"/><circle cx="90" cy="352" r="6"/><circle cx="120" cy="348" r="6"/><circle cx="150" cy="340" r="6"/><circle cx="104" cy="378" r="6"/><circle cx="136" cy="372" r="6"/></g>
<path d="M180 280H240" stroke="#526b96" stroke-width="3" stroke-dasharray="7 7"/>
<rect x="240" y="170" width="190" height="220" rx="15" fill="#192c49" stroke="#3c5d85" stroke-width="2"/><text x="262" y="201" fill="#70e4ce" font-size="16">01 / EDGE</text><g fill="none" stroke="#8fa8ff" stroke-width="3"><path d="M300 240H370M300 262H370M300 284H350"/><rect x="290" y="226" width="90" height="72" rx="6"/></g><text x="335" y="336" text-anchor="middle" fill="#edf3ff" font-size="19">Cached event page</text><text x="335" y="364" text-anchor="middle" fill="#a6bad7" font-size="15">Bot checks, rate limits</text>
<path d="M430 280H480" stroke="#526b96" stroke-width="3" stroke-dasharray="7 7"/>
<rect x="480" y="170" width="300" height="220" rx="15" fill="#192c49" stroke="#3c5d85" stroke-width="2"/><text x="502" y="201" fill="#70e4ce" font-size="16">02 / WAITING ROOM</text>
<g fill="#14243f" stroke="#ffb283" stroke-width="2"><rect x="502" y="236" width="44" height="32" rx="5"/><rect x="554" y="236" width="44" height="32" rx="5"/><rect x="606" y="236" width="44" height="32" rx="5"/><rect x="658" y="236" width="44" height="32" rx="5"/><rect x="710" y="236" width="44" height="32" rx="5"/></g><g fill="#ffbf97" font-size="13" text-anchor="middle"><text x="524" y="257">#901</text><text x="576" y="257">#902</text><text x="628" y="257">#903</text><text x="680" y="257">#904</text><text x="732" y="257">#905</text></g>
<text x="630" y="306" text-anchor="middle" fill="#edf3ff" font-size="19">Signed queue position</text><text x="630" y="334" text-anchor="middle" fill="#a6bad7" font-size="15">Position served from the edge,</text><text x="630" y="356" text-anchor="middle" fill="#a6bad7" font-size="15">not from the booking database</text>
<path d="M780 280H850" stroke="#526b96" stroke-width="3" stroke-dasharray="7 7"/>
<g fill="none" stroke="#6ce5c6" stroke-width="4"><path d="M836 236L866 280L836 324"/><circle cx="878" cy="280" r="10" fill="#6ce5c6"/></g><text x="878" y="350" text-anchor="middle" fill="#6ce5c6" font-size="15">Admission valve</text><text x="878" y="372" text-anchor="middle" fill="#a6bad7" font-size="14">N tokens / minute</text>
<path d="M900 280H950" stroke="#6ce5c6" stroke-width="3"/>
<rect x="950" y="170" width="200" height="220" rx="15" fill="#192c49" stroke="#3c5d85" stroke-width="2"/><text x="972" y="201" fill="#70e4ce" font-size="16">03 / BOOKING</text><g fill="#a6b4ff"><rect x="995" y="228" width="16" height="16" rx="3"/><rect x="1017" y="228" width="16" height="16" rx="3"/><rect x="1039" y="228" width="16" height="16" rx="3" fill="#ffb283"/><rect x="1061" y="228" width="16" height="16" rx="3" fill="#1b3350" stroke="#3c5d85"/><rect x="1083" y="228" width="16" height="16" rx="3" fill="#1b3350" stroke="#3c5d85"/><rect x="995" y="250" width="16" height="16" rx="3" fill="#ffb283"/><rect x="1017" y="250" width="16" height="16" rx="3" fill="#1b3350" stroke="#3c5d85"/><rect x="1039" y="250" width="16" height="16" rx="3"/><rect x="1061" y="250" width="16" height="16" rx="3" fill="#1b3350" stroke="#3c5d85"/><rect x="1083" y="250" width="16" height="16" rx="3" fill="#1b3350" stroke="#3c5d85"/></g><text x="1050" y="306" text-anchor="middle" fill="#edf3ff" font-size="19">Seats, payment</text><text x="1050" y="334" text-anchor="middle" fill="#a6bad7" font-size="15">Bounded, protected</text><text x="1050" y="356" text-anchor="middle" fill="#a6bad7" font-size="15">capacity</text>
<text x="120" y="420" text-anchor="middle" fill="#aabdd8" font-size="15">MILLIONS</text>
<path d="M54 460H1144" stroke="#2a3d5c"/><text x="54" y="500" fill="#c8d4e9" font-size="18">Drain rate = checkouts the inventory and payment systems can safely finish, not what the web tier can accept.</text><text x="54" y="540" fill="#92a8c9" font-size="15">REFERENCE DESIGN · Not an official BookMyShow diagram.</text></g></svg>
