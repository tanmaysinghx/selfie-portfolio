<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="A video film strip split into segments that fan out into four quality lanes of a bitrate ladder">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#a44224" stroke-width="2" opacity="0.4"/>
    </pattern>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#d6cebd"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#efeae0"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <!-- Source film strip -->
  <g transform="translate(80 170)">
    <rect width="300" height="560" rx="6" fill="#1a1816"/>
    <g fill="#efeae0">
      <rect x="14" y="20" width="18" height="26" rx="3"/><rect x="14" y="80" width="18" height="26" rx="3"/>
      <rect x="14" y="140" width="18" height="26" rx="3"/><rect x="14" y="200" width="18" height="26" rx="3"/>
      <rect x="14" y="260" width="18" height="26" rx="3"/><rect x="14" y="320" width="18" height="26" rx="3"/>
      <rect x="14" y="380" width="18" height="26" rx="3"/><rect x="14" y="440" width="18" height="26" rx="3"/>
      <rect x="14" y="500" width="18" height="26" rx="3"/>
      <rect x="268" y="20" width="18" height="26" rx="3"/><rect x="268" y="80" width="18" height="26" rx="3"/>
      <rect x="268" y="140" width="18" height="26" rx="3"/><rect x="268" y="200" width="18" height="26" rx="3"/>
      <rect x="268" y="260" width="18" height="26" rx="3"/><rect x="268" y="320" width="18" height="26" rx="3"/>
      <rect x="268" y="380" width="18" height="26" rx="3"/><rect x="268" y="440" width="18" height="26" rx="3"/>
      <rect x="268" y="500" width="18" height="26" rx="3"/>
    </g>
    <rect x="50" y="30" width="200" height="150" fill="#a44224"/>
    <rect x="50" y="205" width="200" height="150" fill="#c8b9a0"/>
    <rect x="50" y="380" width="200" height="150" fill="#6b635a"/>
    <path d="M130 85 l40 20 l-40 20 z" fill="#f5f1ea"/>
  </g>

  <!-- Fan-out lines -->
  <g fill="none" stroke="#6b635a" stroke-width="2.5" stroke-dasharray="3 9" stroke-linecap="round">
    <path d="M380 450 C 470 450, 470 230, 560 230"/>
    <path d="M380 450 C 470 450, 470 380, 560 380"/>
    <path d="M380 450 C 470 450, 470 530, 560 530"/>
    <path d="M380 450 C 470 450, 470 680, 560 680"/>
  </g>

  <!-- Bitrate ladder lanes: wider blocks = higher bitrate -->
  <g font-family="monospace" font-size="22" letter-spacing="2" fill="#6b635a">
    <text x="560" y="205">1080p · 5000k</text>
    <text x="560" y="355">720p · 2800k</text>
    <text x="560" y="505">480p · 1400k</text>
    <text x="560" y="655">360p · 800k</text>
  </g>
  <g>
    <g fill="#a44224"><rect x="560" y="215" width="150" height="34" rx="4"/><rect x="718" y="215" width="150" height="34" rx="4"/><rect x="876" y="215" width="150" height="34" rx="4"/><rect x="1034" y="215" width="150" height="34" rx="4"/><rect x="1192" y="215" width="150" height="34" rx="4"/></g>
    <g fill="#1767b0"><rect x="560" y="365" width="150" height="28" rx="4"/><rect x="718" y="365" width="150" height="28" rx="4"/><rect x="876" y="365" width="150" height="28" rx="4"/><rect x="1034" y="365" width="150" height="28" rx="4"/><rect x="1192" y="365" width="150" height="28" rx="4"/></g>
    <g fill="#a87800"><rect x="560" y="515" width="150" height="22" rx="4"/><rect x="718" y="515" width="150" height="22" rx="4"/><rect x="876" y="515" width="150" height="22" rx="4"/><rect x="1034" y="515" width="150" height="22" rx="4"/><rect x="1192" y="515" width="150" height="22" rx="4"/></g>
    <g fill="#23864a"><rect x="560" y="665" width="150" height="16" rx="4"/><rect x="718" y="665" width="150" height="16" rx="4"/><rect x="876" y="665" width="150" height="16" rx="4"/><rect x="1034" y="665" width="150" height="16" rx="4"/><rect x="1192" y="665" width="150" height="16" rx="4"/></g>
  </g>

  <!-- Player path switching between lanes -->
  <path d="M560 532 L 710 532 L 718 380 L 1026 380 L 1034 232 L 1184 232 L 1192 526 L 1342 526"
        fill="none" stroke="#1a1816" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="1342" cy="526" r="12" fill="#1a1816"/>

  <!-- Encrypted lock marker -->
  <g transform="translate(1410 330)">
    <rect x="0" y="40" width="90" height="74" rx="8" fill="url(#hatch)" stroke="#a44224" stroke-width="3"/>
    <path d="M18 40 v-14 a27 27 0 0 1 54 0 v14" fill="none" stroke="#a44224" stroke-width="6"/>
  </g>

  <text x="80" y="880" font-family="Georgia, serif" font-style="italic" font-size="70" fill="#1a1816">HLS from scratch</text>
  <text x="84" y="930" font-family="monospace" font-size="24" letter-spacing="4" fill="#6b635a">FFMPEG · BITRATE LADDERS · ABR · AES-128 · JAVA</text>
</svg>
