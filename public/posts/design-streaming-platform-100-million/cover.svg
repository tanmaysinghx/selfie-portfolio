<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Design for 100 million viewers</title><desc id="d">A blueprint splits viewers into media delivery, application decisions and background events. Clarify, estimate, design, and validate.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bed1fa" stroke-opacity=".07"/></pattern></defs>
<rect width="1200" height="630" fill="#101c32"/><rect width="1200" height="630" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="65" fill="#7ee0d6" font-size="16" letter-spacing="3">SYSTEM DESIGN / A STEP-BY-STEP WORKSHOP</text><text x="60" y="150" fill="#f3f6ff" font-size="64" font-weight="700">100 million viewers.</text><text x="64" y="201" fill="#b6c6e1" font-size="28">Start with the workload. Then choose the services.</text>
<rect x="64" y="304" width="236" height="133" rx="16" fill="#1c314f" stroke="#6681ac"/><text x="182" y="359" fill="#f3f6ff" font-size="32" font-weight="700" text-anchor="middle">100M</text><text x="182" y="393" fill="#b6c6e1" font-size="18" text-anchor="middle">concurrent viewers</text>
<g fill="none" stroke="#6681ac" stroke-width="3"><path d="M300 370H370V290H440M370 370H440M370 370V450H440"/><path d="M720 290H798M720 370H798M720 450H798"/></g>
<g fill="#192d47" stroke-width="2"><rect x="440" y="260" width="280" height="60" rx="10" stroke="#7ee0d6"/><rect x="440" y="340" width="280" height="60" rx="10" stroke="#a6b5ff"/><rect x="440" y="420" width="280" height="60" rx="10" stroke="#f4c38a"/></g>
<g font-size="21" font-weight="600"><text x="463" y="299" fill="#7ee0d6">01  Deliver video</text><text x="463" y="379" fill="#a6b5ff">02  Decide access</text><text x="463" y="459" fill="#f4c38a">03  Process events</text></g>
<g font-size="20" fill="#e4eaf7"><text x="815" y="287">MediaLive → CloudFront</text><text x="815" y="313" fill="#94abc9" font-size="15">Reusable media at the edge</text><text x="815" y="367">Java + Spring Boot</text><text x="815" y="393" fill="#94abc9" font-size="15">Bounded business services</text><text x="815" y="447">Go + Kinesis</text><text x="815" y="473" fill="#94abc9" font-size="15">Durable, independent processing</text></g>
<path d="M64 531H1136" stroke="#344b6c"/><text x="64" y="580" fill="#b6c6e1" font-size="19">CLARIFY  →  ESTIMATE  →  DESIGN  →  VALIDATE</text><text x="1136" y="580" fill="#7ee0d6" font-size="15" text-anchor="end">ILLUSTRATIVE ARCHITECTURE</text></g></svg>
